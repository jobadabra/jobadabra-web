name: Release · Website

# Deploys the website (workers/www, website/, admin/, api/, shared/) to Cloudflare when it changes on main, and when the public files it bundles change (public-watch.yml dispatches this).
# Runs in the tree of the public repo with this one laid over it (tools/tree.sh): the Worker imports the public validators (../../extension/...).
# Live at https://www.jobpilotto.top (Workers static assets, free).
# Secrets: CLOUDFLARE_API_TOKEN (template "Edit Cloudflare Workers"), CLOUDFLARE_ACCOUNT_ID.
on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'admin/**'
      - 'api/**'
      - 'shared/**'
      - 'workers/www/**'
      - 'ops/db/migrations/**'
      - '.github/workflows/site.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-deploy
  cancel-in-progress: false   # a started run finishes and the next waits: a cancelled run is a red cross on main (tests/test_main_runs_finish.py)

jobs:
  # Why (13 Nov 2026, plan 2026-11-13-cloud-runners.md 3/3; owner: "prepare the CICD for staging... but let's keep it disabled until we have first real users" · "I'd like to avoid now long
  # CICD during the developpment phase"): with the repo variable STAGING_GATE = on, the site deploys to www-staging and every route is asked there first; a red staging stops production.
  # Off (today) the job is skipped and the deploy runs as before.
  staging:
    if: vars.STAGING_GATE == 'on'
    uses: ./.github/workflows/site-staging.yml
    secrets: inherit
  deploy:
    needs: staging
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25   # Why (13 Nov 2026): up to 15 min waiting for the Apply runner after a rename; a normal deploy takes about 2
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SELFHEAL_PUBLISH_KEY: ${{ secrets.SELFHEAL_PUBLISH_KEY }}   # job-wide: a step's own env is not visible to its `if`
      AI_COST_PUBLISH_KEY: ${{ secrets.AI_COST_PUBLISH_KEY }}
      REPLAYS_PUBLISH_KEY: ${{ secrets.REPLAYS_PUBLISH_KEY }}
    steps:
      - name: Not set up yet
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::notice::Add the CLOUDFLARE_API_TOKEN secret (Cloudflare → API Tokens → Edit Cloudflare Workers) to deploy the site."
      - uses: actions/checkout@v5
        if: env.CLOUDFLARE_API_TOKEN != ''
        with:
          path: .private
      - name: Lay the public repo's tree under this one
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: .private/tools/tree.sh
      - uses: actions/setup-node@v5
        if: env.CLOUDFLARE_API_TOKEN != ''
        with:
          node-version: '22'
      - name: "Database migrations (db/migrations: stats, app reports)"
        if: env.CLOUDFLARE_API_TOKEN != ''
        continue-on-error: true   # a token without D1 rights must not block the deploy; the warning says to apply by hand
        working-directory: workers/www
        run: |
          npx --yes wrangler@4 d1 migrations apply www-stats --remote \
            || { echo "::warning::D1 migrations not applied (the token needs D1 Edit). Apply: cd workers/www && npx wrangler@4 d1 migrations apply www-stats --remote"; exit 1; }
      - name: "R2 bucket of the Lab's fill videos (workers/www/wrangler.toml LAB_FILLS)"
        if: env.CLOUDFLARE_API_TOKEN != ''
        continue-on-error: true   # already there = fine; a token without R2 rights must not block the deploy, the warning says what to run
        working-directory: workers/www
        run: |
          npx --yes wrangler@4 r2 bucket info lab-fills >/dev/null 2>&1 || npx --yes wrangler@4 r2 bucket create lab-fills \
            || { echo "::warning::R2 bucket lab-fills not created (the token needs R2 Edit). Create: cd workers/www && npx wrangler@4 r2 bucket create lab-fills"; exit 1; }
      - name: "R2 bucket of the feedback screenshots and logs (workers/www/wrangler.toml FEEDBACK_FILES)"
        if: env.CLOUDFLARE_API_TOKEN != ''
        continue-on-error: true   # already there = fine; a token without R2 rights must not block the deploy, the warning says what to run
        working-directory: workers/www
        run: |
          npx --yes wrangler@4 r2 bucket info feedback-files >/dev/null 2>&1 || npx --yes wrangler@4 r2 bucket create feedback-files \
            || { echo "::warning::R2 bucket feedback-files not created (the token needs R2 Edit). Create: cd workers/www && npx wrangler@4 r2 bucket create feedback-files"; exit 1; }
      # Why (13 Nov 2026, runner rename, plan 2026-11-13-cloud-runners.md 2/3): the deploy refuses a queue or a service binding that does not exist yet ("Worker A declares a binding to Worker B, which does not
      # yet exist"); the queues are made here, and the Apply runner comes from release-ready-runner.yml on the same merge (about 2 min), so the site waits for it instead of failing.
      - name: The runners' queues, made when missing (workers/www/wrangler.toml HOSTED_QUEUE, READY_QUEUE)
        if: env.CLOUDFLARE_API_TOKEN != ''
        working-directory: workers/www
        run: |
          for queue in find-jobs-runs apply-runs; do
            npx --yes wrangler@4 queues info "$queue" >/dev/null 2>&1 || ../../tools/cf-retry.sh npx --yes wrangler@4 queues create "$queue" || npx --yes wrangler@4 queues info "$queue" >/dev/null
          done
      - name: Wait for the Apply runner Worker (workers/www/wrangler.toml READY_RUNNER)
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          for try in $(seq 1 45); do
            curl -fsS -o /dev/null -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/apply-runner/settings" && { echo "apply-runner is deployed"; exit 0; }
            echo "apply-runner not deployed yet (try $try of 45): release-ready-runner.yml deploys it"; sleep 20
          done
          echo "::error::the Worker apply-runner does not exist after 15 min: run Release · Ready to send runner, then this workflow again"; exit 1
      - name: Deploy to Cloudflare
        if: env.CLOUDFLARE_API_TOKEN != ''
        working-directory: workers/www
        run: ../../tools/cf-retry.sh npx --yes wrangler@4 deploy --config wrangler.toml
      # The key CI uses to publish the self-healing loop's numbers to /self-heal (self-heal-stats.yml); the Worker gets it from the GitHub secret.
      - name: The publish key of /self-heal
        if: env.CLOUDFLARE_API_TOKEN != '' && env.SELFHEAL_PUBLISH_KEY != ''
        working-directory: workers/www
        run: ../../tools/cf-retry.sh bash -c 'printf "%s" "$SELFHEAL_PUBLISH_KEY" | npx --yes wrangler@4 secret put SELFHEAL_PUBLISH_KEY --config wrangler.toml'
      # The key the scheduled jobs use to report their AI cost to /ai-cost (desktop/e2e/ai-cost-report.mjs).
      - name: The publish key of /ai-cost
        if: env.CLOUDFLARE_API_TOKEN != '' && env.AI_COST_PUBLISH_KEY != ''
        working-directory: workers/www
        run: ../../tools/cf-retry.sh bash -c 'printf "%s" "$AI_COST_PUBLISH_KEY" | npx --yes wrangler@4 secret put AI_COST_PUBLISH_KEY --config wrangler.toml'
      # The key CI uses to send the recorded replays of main to /admin/form-filling/lab (page-cases.yml, desktop/e2e/replays-report.mjs): it can write that table only.
      - name: The publish key of the Fixed-site replays
        if: env.CLOUDFLARE_API_TOKEN != '' && env.REPLAYS_PUBLISH_KEY != ''
        working-directory: workers/www
        run: ../../tools/cf-retry.sh bash -c 'printf "%s" "$REPLAYS_PUBLISH_KEY" | npx --yes wrangler@4 secret put REPLAYS_PUBLISH_KEY --config wrangler.toml'
