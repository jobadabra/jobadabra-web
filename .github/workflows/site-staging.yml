name: Release · Website staging

# A staging copy of the website on its own Worker (www-staging, https://www-staging.jobpilotto.workers.dev): no custom domain, no cron, none of production's secrets and its own Hosted data (D1, KV, bucket, queue: tools/staging-config.mjs), production untouched.
# Then every route of docs/site-routes.json is asked on both and the table goes to the run's summary. By hand only (the proof that this repo deploys the site, owner 20 Oct 2026).
# Secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID.
on:
  workflow_dispatch:
  workflow_call:   # site.yml, when the repo variable STAGING_GATE is on (plan 2026-11-13-cloud-runners.md 3/3)

permissions:
  contents: read

concurrency:
  group: site-staging
  cancel-in-progress: false

jobs:
  staging:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
        with:
          path: .private
      - name: Lay the public repo's tree under this one
        run: .private/tools/tree.sh
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Staging config (own name, no routes, no cron)
        run: node tools/staging-config.mjs www-staging
      - name: Apply the migrations to staging's own database
        working-directory: workers/www
        run: ../../tools/cf-retry.sh npx --yes wrangler@4 d1 migrations apply www-stats-staging --remote --config wrangler.staging.toml
      - name: Staging's queues, made when missing, and its Apply runner (the deploy refuses a queue or a service binding that does not exist)
        working-directory: workers/www
        run: |
          for queue in find-jobs-runs-staging apply-runs-staging; do
            npx --yes wrangler@4 queues info "$queue" >/dev/null 2>&1 || ../../tools/cf-retry.sh npx --yes wrangler@4 queues create "$queue" || npx --yes wrangler@4 queues info "$queue" >/dev/null
          done
          curl -fsS -o /dev/null -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/apply-runner-staging/settings" \
            || { echo "::error::the Worker apply-runner-staging does not exist: run Release · Ready to send runner with target staging once, then this workflow again"; exit 1; }
      - name: Deploy the staging Worker
        working-directory: workers/www
        run: ../../tools/cf-retry.sh npx --yes wrangler@4 deploy --config wrangler.staging.toml
      - name: Staging's own secrets, made once (random, never read by anyone)
        # Why (5 Nov 2026, hr 3/6): staging has its own Hosted data now, so it needs a salt and a key of its own. A value is made here only when the Worker lacks it; it is never printed or stored
        # elsewhere, and staging holds fictional data only, so losing it costs nothing (delete the secret to start fresh). Production's secrets are never touched.
        working-directory: workers/www
        run: |
          have="$(npx --yes wrangler@4 secret list --config wrangler.staging.toml --format json)"
          for name in STATS_SALT HOSTED_KEK; do
            echo "$have" | grep -q "\"$name\"" && { echo "$name: already set"; continue; }
            # The generator is inside the retried command: a retry makes a fresh value, never reads an emptied pipe and stores a blank secret (Gitar on #371).
            ../../tools/cf-retry.sh bash -c 'openssl rand -hex 32 | npx --yes wrangler@4 secret put "$0" --config wrangler.staging.toml' "$name"
          done
      - name: Ask every route on staging and on production
        run: |
          set -o pipefail
          sleep 10
          node tools/probe-routes.mjs https://www-staging.jobpilotto.workers.dev https://www.jobadabra.top   # not workers.dev: its pages 301 there since 27 Oct 2026
