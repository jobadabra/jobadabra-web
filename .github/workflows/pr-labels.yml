# The caller of the org's ONE PR-labels workflow (owner, 13 Nov 2026: "One shared workflow (Recommended)"). This file is identical in every repo of the org (templates/org-repo/pr-labels.yml; the weekly org check
# reports a drift): only the events that start it, the run name and the permissions are here. What the label shows, which event changes it and why: jobadabra's .github/workflows/pr-labels-shared.yml.
name: PR
# Why (30 Oct 2026, run names): the value stays quoted, or the ' #' in it starts a YAML comment and cuts the number off; a push to main, a Gitar check and the sweep have no number, so they get their own words.
run-name: "${{ github.event_name == 'push' && 'PR labels after a push to main' || github.event_name == 'check_run' && 'PR labels after a Gitar check' || github.event_name == 'workflow_dispatch' && 'PR labels sweep · on time (Worker cron)' || format('PR labels on #{0}', github.event.pull_request.number || github.event.issue.number) }}"

on:
  push:
    branches: [main]
  pull_request_target:
    types: [opened, synchronize, reopened]
  pull_request_review:
    types: [submitted, dismissed]
  issue_comment:
    types: [created]
  check_run:
    types: [created, completed]
  workflow_dispatch:   # a person, or a timer that sweeps every open PR (jobadabra: the Worker's ten-minute tick, app-core/src/scheduler.js)

jobs:
  labels:
    permissions:   # at least what the called workflow asks for (its permissions: block), or GitHub refuses to start the run
      contents: read
      checks: read
      pull-requests: write
      issues: write
    uses: jobadabra/jobadabra/.github/workflows/pr-labels-shared.yml@main
