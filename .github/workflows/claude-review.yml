name: CI · Claude review
run-name: Claude review · ${{ inputs.prs || github.event.issue.number }}${{ github.event_name == 'issue_comment' && ' (asked by comment)' || '' }}
# jobadabra-web's caller of jobadabra's shared Claude reviewer (jobadabra/jobadabra .github/workflows/claude-review-shared.yml, read from its main: a fix lands in every repo at once). Same file as jobadabra's own caller; only the events that start it.
# Why (owner via coordinator mac-95, 14 Nov 2026: "replace Gitar with Claude Code review", cr PR 3): two ways in, both the owner's:
#   the comment "@claude review" on a PR (author_association OWNER or MEMBER only): reviews the current head at once, on a draft or a red head too;
#   workflow_dispatch with `prs` (numbers, space or comma separated): the same ask, by hand, for a batch (2 at a time); `sha` is for a green-head hand-over that this repo does not have yet (jobadabra's pr-verdict.py has it).
# The rules it reviews by are this repo's own `.gitar/review/*.md` on the base branch when it has the folder (none today: the base prompt alone). Fails soft when the Claude plan is out (a green job and one note on the PR).
# A workflow reached by issue_comment or workflow_dispatch runs from the default branch: this file only works once it is on main.
on:
  workflow_dispatch:
    inputs:
      prs: {description: 'PR numbers, space or comma separated', required: true, type: string}
      sha: {description: 'automatic only: the head that went green (empty = the owner asked by hand)', required: false, default: '', type: string}
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  plan:
    name: Which PRs
    # Why (13 Nov 2026, cr): the comment path is the owner's alone: only a PR comment starting "@claude review" by OWNER or MEMBER; a fork PR's code never meets the plan token (the gate refuses it too).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.pull_request && startsWith(github.event.comment.body, '@claude review') &&
       (github.event.comment.author_association == 'OWNER' || github.event.comment.author_association == 'MEMBER'))
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      prs: ${{ steps.prs.outputs.prs }}
    steps:
      - id: prs
        env:
          INPUT_PRS: ${{ inputs.prs }}
          COMMENT_PR: ${{ github.event.issue.number }}
        run: |
          list="${INPUT_PRS:-$COMMENT_PR}"
          json="$(printf '%s' "$list" | tr -s ', ' '\n' | grep -E '^[0-9]+$' | sort -un | jq -R 'tonumber' | jq -cs .)"
          [ -n "$json" ] && [ "$json" != "[]" ] || { echo "no PR number in: $list" >&2; exit 1; }
          echo "prs=$json" >> "$GITHUB_OUTPUT"

  review:
    name: Claude review of PR ${{ matrix.pr }}
    needs: plan
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        pr: ${{ fromJSON(needs.plan.outputs.prs) }}
    permissions:
      contents: read
      pull-requests: write
      issues: write
    uses: jobadabra/jobadabra/.github/workflows/claude-review-shared.yml@main
    with:
      pr: ${{ format('{0}', matrix.pr) }}
      mode: ${{ inputs.sha != '' && 'auto' || 'manual' }}
      sha: ${{ inputs.sha }}
      asked_by: ${{ github.event_name == 'issue_comment' && github.event.comment.author_association || 'DISPATCH' }}
    secrets: inherit
