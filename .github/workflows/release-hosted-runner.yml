name: Release · Always on runner
# Deploys the hosted Always on runner Worker and its container image (workers/hosted-runner, hosted/Dockerfile: the engine as the app runs it). Started by public-watch.yml (production, when the engine
# or the runner's own files changed) or by hand (`staging` or `production`).
# Why (5 Nov 2026, hr 2/6; owner: "why the Easiest not open yet?"): the Worker was written on 16 Oct and its header said site.yml deploys it; no workflow ever did, so the queue (then hosted-runs) had
# no consumer and Always on on our servers could not run. Not on push: the engine lives in the public repo, so public-watch.yml starts production when it changes (13 Nov 2026, owner:
# "Deploy unattended (Recommended)", replacing 5 Nov's "You, at that step" wait for the owner's yes).
# Secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID (the same as Release · Ready to send runner). The image carries no secret and no user data.
on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Where to deploy the runner'
        type: choice
        options: [staging, production]
        default: staging
permissions:
  contents: read
concurrency:
  group: hosted-runner-deploy-${{ inputs.target }}
  cancel-in-progress: false   # a started run finishes and the next waits: a cancelled run is a red cross on main (tests/test_main_runs_finish.py)
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    # Why (13 Nov 2026, owner, asked via AskUserQuestion: "Deploy unattended (Recommended)"; replaces the 5 Nov approval gate of #369): production deploys with no click, like the site and Ready to send,
    # because the gate left hosted Always on on the 5 Nov engine for 8 days. The safety is the rollout wait below and each run's own check that it runs the deployed build (#387).
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Not set up yet
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::notice::Add the CLOUDFLARE_API_TOKEN secret to deploy the Always on runner."
      - uses: actions/checkout@v5
        if: env.CLOUDFLARE_API_TOKEN != ''
        with:
          path: .private
      - name: Lay the public repo's tree under this one
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: .private/tools/tree.sh
      - uses: actions/setup-node@v5
        if: env.CLOUDFLARE_API_TOKEN != ''
        with:
          node-version: '22'
      - name: The staging copy of the config (own Worker name, own queue)
        if: env.CLOUDFLARE_API_TOKEN != '' && inputs.target == 'staging'
        run: node tools/runner-config.mjs staging
      - name: The staging queue, made when missing (the deploy refuses a consumer queue that does not exist)
        if: env.CLOUDFLARE_API_TOKEN != '' && inputs.target == 'staging'
        working-directory: workers/hosted-runner
        run: npx --yes wrangler@4 queues info find-jobs-runs-staging >/dev/null 2>&1 || ../../tools/cf-retry.sh npx --yes wrangler@4 queues create find-jobs-runs-staging
      - name: The production queue, made when missing (site.yml makes it too, before the site sends to it)
        if: env.CLOUDFLARE_API_TOKEN != '' && inputs.target == 'production'
        working-directory: workers/hosted-runner
        run: npx --yes wrangler@4 queues info find-jobs-runs >/dev/null 2>&1 || ../../tools/cf-retry.sh npx --yes wrangler@4 queues create find-jobs-runs || npx --yes wrangler@4 queues info find-jobs-runs >/dev/null
      - name: Deploy the runner and its image
        if: env.CLOUDFLARE_API_TOKEN != ''
        working-directory: workers/hosted-runner
        env:
          CONFIG: ${{ inputs.target == 'staging' && 'wrangler.staging.jsonc' || 'wrangler.jsonc' }}
        # Why (5 Nov 2026, hr 6/6 try 5): the output names the image digest it pushed; the wait below waits for THAT digest (the newest listed version lagged and gave a false DONE).
        run: |
          set -o pipefail
          # Why (5 Nov 2026, hr 6/6 try 6, owner: "Each run checks"): the stamp this tree builds; the runner compares it with each container's GET / before a run.
          HOSTED_BUILD=$(python3 -P ../../src/build_stamp.py ../../src)   # -P: no src/ module can shadow the standard library
          [ -n "$HOSTED_BUILD" ] || { echo "::error::no engine build stamp from src/build_stamp.py: the runs could not check their container" >&2; exit 1; }
          echo "deploying engine build $HOSTED_BUILD"
          npm install --no-audit --no-fund && ../../tools/cf-retry.sh npx --yes wrangler@4 deploy --config "$CONFIG" --var "HOSTED_BUILD:$HOSTED_BUILD" 2>&1 | tee "$RUNNER_TEMP/deploy.out"
      - name: Wait until the container application runs the new image
        if: env.CLOUDFLARE_API_TOKEN != ''
        working-directory: workers/hosted-runner
        env:
          CONFIG: ${{ inputs.target == 'staging' && 'wrangler.staging.jsonc' || 'wrangler.jsonc' }}
        # Why (5 Nov 2026, hr 6/6, try 3 and 5): "deploy" succeeds before the application moves to the new image (try 3 tested the old code); the target is the digest the deploy pushed, since the newest listed version can lag (try 5: a false DONE).
        run: node ../../tools/wait-container-rollout.mjs "$CONFIG" --timeout-min=10 --deploy-output="$RUNNER_TEMP/deploy.out"
