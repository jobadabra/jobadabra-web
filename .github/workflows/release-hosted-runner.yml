name: Release · Always on runner
# Deploys the hosted Always on runner Worker and its container image (workers/hosted-runner, hosted/Dockerfile: the engine as the app runs it). By hand only: pick `staging` or `production`.
# Why (5 Nov 2026, hr 2/6; owner: "why the Easiest not open yet?"): the Worker was written on 16 Oct and its header said site.yml deploys it; no workflow ever did, so the queue hosted-runs had
# no consumer and Always on on our servers could not run. By hand, not on push: a production deploy waits for the owner's yes after the staging proof (owner, 5 Nov 2026: "You, at that step").
# Secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID (the same as Release · Ready to send runner). The image carries no secret and no user data.
# TODO(AI): redeploy when the engine files the image bundles change (src, config, templates, requirements), as public-watch.yml does for the Ready to send runner, once production is live (5 Nov 2026).
on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Where to deploy the runner'
        type: choice
        options: [staging, production]
        default: staging
permissions:
  contents: read
concurrency:
  group: hosted-runner-deploy-${{ inputs.target }}
  cancel-in-progress: false   # a started run finishes and the next waits: a cancelled run is a red cross on main (tests/test_main_runs_finish.py)
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Not set up yet
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::notice::Add the CLOUDFLARE_API_TOKEN secret to deploy the Always on runner."
      - uses: actions/checkout@v5
        if: env.CLOUDFLARE_API_TOKEN != ''
        with:
          path: .private
      - name: Lay the public repo's tree under this one
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: .private/tools/tree.sh
      - uses: actions/setup-node@v5
        if: env.CLOUDFLARE_API_TOKEN != ''
        with:
          node-version: '22'
      - name: The staging copy of the config (own Worker name, own queue)
        if: env.CLOUDFLARE_API_TOKEN != '' && inputs.target == 'staging'
        run: node tools/runner-config.mjs staging
      - name: Deploy the runner and its image
        if: env.CLOUDFLARE_API_TOKEN != ''
        working-directory: workers/hosted-runner
        env:
          CONFIG: ${{ inputs.target == 'staging' && 'wrangler.staging.jsonc' || 'wrangler.jsonc' }}
        run: npm install --no-audit --no-fund && ../../tools/cf-retry.sh npx --yes wrangler@4 deploy --config "$CONFIG"
