name: Release · AI broker
# Deploys the AI broker Worker and its container image (workers/ai-broker) when they change on main. The broker holds the owner's one ChatGPT/Codex login and runs every CI, scheduled and
# benchmark AI call (spec docs/superpowers/specs/2026-10-28-ci-on-codex-subscription-design.md in the public repo). Same secrets as Release · Ready to send runner. The image holds no secret; the login lives in the Durable Object.
# Why (28 Oct 2026, owner): CI on Free AI billed ~$4/day of neurons unseen; the owner bought a Codex plan and wants CI on it.
# Why (1 Nov 2026, owner: rename to ai-broker): by hand only until the Durable Object transfer from jobadabra-codex-broker has run (done 1 Nov 2026); a push trigger would deploy the new Worker name
# with an EMPTY namespace and lose the Codex login. The transfer has run (1 Nov 2026) and its folder is gone (7/7, 2 Nov 2026).
# Why (4 Nov 2026, owner: "Yes, deploy on merge (Recommended)"): this workflow deployed the broker from CI twice (3 Nov, 4 Nov: run 41803869726), so a merge to main that changes the broker or a shared file it imports
# deploys it. The "Refuse unless the broker holds a login" step below stays: a deploy that would lose the login stops before it ships. By hand still works.
on:
  push:
    branches: [main]
    paths:   # the broker, and the four shared files it imports (a test-only or workflow-only change deploys nothing)
             # Gap (Gitar, 4 Nov 2026): free-ai-models.js and free-ai-translate.js only re-export the public repo's desktop/lib/; a change THERE does not trigger this, run it by hand
      - 'workers/ai-broker/**'
      - '!workers/ai-broker/**/*.md'   # Why (11 Nov 2026): a README change redeploys nothing; a deploy leaves ~9 min with no container
      - 'shared/github-oidc.js'
      - 'shared/free-ai-models.js'
      - 'shared/free-ai-translate.js'
      - 'shared/pro-claude.js'
  workflow_dispatch:
permissions:
  contents: read
  id-token: write   # the room claim below (tools/persona-search/claim.py asks the broker with this job's GitHub run token)
concurrency:
  group: ai-broker-deploy
  cancel-in-progress: false   # a started run finishes and the next waits: a cancelled run is a red cross on main (tests/test_main_runs_finish.py)
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 75   # up to 45 min in line for the room + 7 min holding it after the deploy + the deploy itself
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Not set up yet
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::notice::Add the CLOUDFLARE_API_TOKEN secret to deploy the AI broker."
      - uses: actions/checkout@v5
        if: env.CLOUDFLARE_API_TOKEN != ''
        with:
          path: .private
      - name: Lay the public repo's tree under this one
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: .private/tools/tree.sh
      - uses: actions/setup-node@v5
        if: env.CLOUDFLARE_API_TOKEN != ''
        with:
          node-version: '22'
      - name: Refuse unless the broker holds a login
        if: env.CLOUDFLARE_API_TOKEN != ''
        # Why (#285, 5 Nov 2026): `starting` = a login is stored and the container has not answered yet (a fresh container start); this gate asks only for the login, so it accepts both.
        # Why (2 Nov 2026, ab): a block scalar. The one-line form held `: ` inside the echo text, which YAML reads as a second mapping key: GitHub refused the whole file ("workflow file issue") and marked every push to main red, 108 runs from 1 Nov 21:27 UTC.
        run: |
          curl -fsS --max-time 30 https://jobadabra-ai-broker.jobpilotto.workers.dev/health | grep -Eq '"state":"(ready|starting)"' || { echo "::error::The AI broker is not ready with a login: a deploy would not restore it: upload the Codex login first (BROKER_ADMIN_TOKEN, see the header of workers/ai-broker/wrangler.jsonc)."; exit 1; }
      - name: The broker's own tests first
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: node --test test/unit/workers/ai-broker/*.test.js
      # Why (13 Nov 2026, cx; sa: "go on (a)"): a deploy resets the broker's Durable Object 4.5-5 min later ("Durable Object reset because its code was updated": 04:00 x30,
      # 04:17 x19, 04:26 x49 after the deploys of 03:55, 04:12 and 04:21Z), and the reset cuts every call in flight; at 04:17:50Z it cut 20 calls of tr's 30-profile round, each
      # waiting 40-46 s (the relay asks a cut call again after 30 s). #501's drain covers a container swap, not this reset. So the release takes the whole room the searches claim
      # (lib/claims.mjs CAPACITY), first come first served: it waits behind the runs that hold it, no search starts while it holds it, and it gives it back once the new code runs.
      # Guard: test/unit/workers/ai-broker/release-room.test.js.
      - name: Take the whole broker room
        id: room
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          if timeout 45m python3 tools/persona-search/claim.py wait 6; then
            nohup python3 tools/persona-search/claim.py hold 6 > "$RUNNER_TEMP/claim-hold.log" 2>&1 &
            echo $! > "$RUNNER_TEMP/claim-hold.pid"
            echo "held=1" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No broker room within 45 min (or the claim failed): deploying anyway. Calls in flight about 5 min from now are cut and asked again after 30 s."
          fi
      - name: Deploy the broker and its image
        if: env.CLOUDFLARE_API_TOKEN != ''
        working-directory: workers/ai-broker
        run: npm install --no-audit --no-fund && ../../tools/cf-retry.sh npx --yes wrangler@4 deploy
      - name: Keep the room until the broker runs the new code
        if: steps.room.outputs.held == '1'
        run: sleep 420   # the resets came 4.5-5 min after their deploy; /health names no version to wait on
      - name: Give the room back
        if: always() && steps.room.outputs.held == '1'
        run: |
          kill "$(cat "$RUNNER_TEMP/claim-hold.pid")" 2>/dev/null || true
          python3 tools/persona-search/claim.py release
