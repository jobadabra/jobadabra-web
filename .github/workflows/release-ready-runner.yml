name: Release · Ready to send runner
# (In the private site repo since 20 Oct 2026; a change to the public files it builds from starts it through public-watch.yml.)
# Deploys the Ready to send runner Worker and its container image (workers/ready-runner, hosted/ready-fill) when they change on main, after one night
# in the built image passes (hosted/ready-fill/image-check.mjs). Was a deploy by hand from a Mac (18 Oct 2026, owner: shorten the loop).
# Secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID (the same as Release · Website). The image carries no secret and no user data.
on:
  push:
    branches: [main]
    paths:
      - 'workers/ready-runner/**'
      - 'api/ready-consume.js'
      - 'ops/hosted/ready-fill/**'   # Why (5 Nov 2026, hr): the container's own files moved here in #280 without this line, so #403's fix never deployed
      - '.github/workflows/release-ready-runner.yml'
  workflow_dispatch:
    inputs:
      target:
        description: 'Where to deploy the runner (a push deploys production)'
        type: choice
        options: [production, staging]
        default: production
permissions:
  contents: read
concurrency:
  group: ready-runner-deploy
  cancel-in-progress: false   # a started run finishes and the next waits: a cancelled run is a red cross on main (tests/test_main_runs_finish.py)
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Why (13 Nov 2026, plan 2026-11-13-cloud-runners.md 3/3; owner: "prepare the CICD for staging... but let's keep it disabled until we have first real users"): with the repo variable
      # STAGING_GATE = on, a production deploy goes to the staging runner (apply-runner-staging, queue apply-runs-staging) first and stops there if its container does not come up.
      CONFIGS: ${{ inputs.target == 'staging' && 'wrangler.staging.jsonc' || vars.STAGING_GATE == 'on' && 'wrangler.staging.jsonc wrangler.jsonc' || 'wrangler.jsonc' }}
    steps:
      - name: Not set up yet
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::notice::Add the CLOUDFLARE_API_TOKEN secret to deploy the Ready to send runner."
      - uses: actions/checkout@v5
        if: env.CLOUDFLARE_API_TOKEN != ''
        with:
          path: .private
      - name: Lay the public repo's tree under this one
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: .private/tools/tree.sh
      - uses: actions/setup-node@v5
        if: env.CLOUDFLARE_API_TOKEN != ''
        with:
          node-version: '22'
      - name: One night in the built image first
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: docker build -f hosted/ready-fill/Dockerfile -t ready-fill:check . && node hosted/ready-fill/image-check.mjs ready-fill:check
      - name: The staging copy of the config (own Worker name, own queue)
        if: env.CLOUDFLARE_API_TOKEN != '' && contains(env.CONFIGS, 'staging')
        run: node tools/runner-config.mjs staging apply
      - name: The queues, made when missing (the deploy refuses a consumer queue that does not exist; site.yml may make it at the same moment)
        if: env.CLOUDFLARE_API_TOKEN != ''
        working-directory: workers/ready-runner
        run: |
          for CONFIG in $CONFIGS; do
            queue=apply-runs; [ "$CONFIG" = wrangler.staging.jsonc ] && queue=apply-runs-staging
            npx --yes wrangler@4 queues info "$queue" >/dev/null 2>&1 || ../../tools/cf-retry.sh npx --yes wrangler@4 queues create "$queue" || npx --yes wrangler@4 queues info "$queue" >/dev/null
          done
      - name: Deploy the runner and its image (staging first when the gate is on, and wait until its container runs the new image)
        if: env.CLOUDFLARE_API_TOKEN != ''
        working-directory: workers/ready-runner
        run: |
          set -o pipefail
          npm install --no-audit --no-fund
          for CONFIG in $CONFIGS; do
            ../../tools/cf-retry.sh npx --yes wrangler@4 deploy --config "$CONFIG" 2>&1 | tee "$RUNNER_TEMP/deploy.out"
            [ "$CONFIG" = wrangler.jsonc ] || node ../../tools/wait-container-rollout.mjs "$CONFIG" --timeout-min=10 --deploy-output="$RUNNER_TEMP/deploy.out"
          done
